[build-system]
requires = ["hatchling>=1.26,<2"]
build-backend = "hatchling.build"

[project]
name = "bitmask-speculation"
dynamic = ["version"]
description = "Packed grammar masks for draft scheduling and token verification"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
authors = [{name = "S Karthikeyan S."}]
keywords = ["speculative-decoding", "structured-output", "grammar", "inference"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

[project.urls]
Repository = "https://github.com/karthikeyansura/bitmask-speculation"

[project.optional-dependencies]
models = ["torch>=2.6,<3", "transformers>=4.51,<6"]
grammar = ["xgrammar==0.2.8"]

[dependency-groups]
dev = ["build>=1.2.2,<2", "pytest>=8,<10"]

[tool.pytest.ini_options]
testpaths = ["tests/unit", "tests/integration"]
addopts = ["--import-mode=importlib", "--strict-config", "--strict-markers"]

[tool.hatch.version]
path = "src/bitmask_speculation/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/bitmask_speculation"]

[tool.hatch.build.targets.sdist]
include = [
    "/src/bitmask_speculation",
    "/docs",
    "/tests/unit",
    "/tests/integration",
    "/README.md",
    "/LICENSE",
    "/pyproject.toml",
    "/uv.lock",
    "/.python-version",
]
